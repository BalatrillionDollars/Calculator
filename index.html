<html>
<head>
    <link rel="stylesheet" href="style.css">
    <script src = "index.js"></script>
    <meta charset="UTF-8">
    <title>LM-XX</title>
</head>
<body>
    <div class = "calculator">
        <div id = "display">
            <input id = "in">
            <div>
                <p id = "out">LM-XX™ (2023-2027)</p>
            </div>
        </div>
        <div id = "grid">
            <button onclick = "add('(');" class = "func-L">(</button>
            <p id = "name">LM-XX™</p>
            <button onclick = "add(')');" class = "func-L">)</button>
            <button onclick = "add('+');" class = "func-S">+</button>
            <button onclick = "add('-');" class = "func-S">-</button>
            <button onclick = "add('*');" class = "func-S">*</button>
            <button onclick = "add('/');" class = "func-S">/</button>
            <button onclick = "add('^');" class = "func-S">^</button>
            <button onclick = "add('%');" class = "func-S">%</button>
            <button onclick = "add('1');" class = "number">1</button>
            <button onclick = "add('2');" class = "number">2</button>
            <button onclick = "add('3');" class = "number">3</button>
            <button onclick = "add('4');" class = "number">4</button>
            <button onclick = "add('5');" class = "number">5</button>
            <button onclick = "add('6');" class = "number">6</button>
            <button onclick = "add('7');" class = "number">7</button>
            <button onclick = "add('8');" class = "number">8</button>
            <button onclick = "add('9');" class = "number">9</button>
            <button onclick = "add('.');" class = "func-M">.</button>
            <button onclick = "add('0');" class = "number">0</button>
            <button onclick = "ev()" class = "func-M">=</button>
        </div>
            <button class = "arrow" id = "arrowL" onclick="arrow(-1)">
                <img src = "Brackets.png">
            </button>
            <button class = "arrow" id = "arrowR" onclick="arrow(1)">
                <img src = "Brackets%20(1).png">
            </button>
        </div>
    </div>
</body>
</html>
